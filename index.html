<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121c24">
  <style>
    :root {
      --bg: #121c24;
      --card: #1b2832;
      --text: #ffffff;
      --muted: #8ca0af;
      --accent-in: #d4af37;
      --accent-out: #5b7c4d;
      --accent-btn: #738fa7;
      --border: #263846;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 10px;
    }
    .time-title {
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .date-title {
      font-size: 1.2rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .circles-row {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin: 10px 0;
    }
    .circle-btn {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      font-size: 1.3rem;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    .circle-btn:active { transform: scale(0.95); }
    .btn-in { background-color: var(--accent-in); color: #111; }
    .btn-out { background-color: var(--accent-out); }

    .time-block {
      text-align: center;
      width: 100%;
    }
    .time-label {
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .time-desc {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.3;
      padding: 0 10px;
      cursor: pointer;
    }
    .time-desc span {
      border-bottom: 1px dashed var(--muted);
    }

    .plus-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      background-color: var(--accent-btn);
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      margin: 10px 0;
    }

    .summary-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      margin-top: 20px;
    }
    .summary-title {
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .summary-desc {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 15px;
      line-height: 1.4;
    }
    .export-btn {
      background-color: var(--border);
      color: var(--text);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }
    .logs-list {
      text-align: left;
      margin-top: 15px;
      font-size: 0.8rem;
      max-height: 150px;
      overflow-y: auto;
    }
    .log-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Nagłówek Zegar i Data -->
  <div class="header">
    <div id="live-clock" class="time-title">00:00:00</div>
    <div id="live-date" class="date-title">Ładowanie daty...</div>
  </div>

  <!-- Przyciski IN / OUT -->
  <div class="circles-row">
    <button class="circle-btn btn-in" onclick="pressIn()">IN</button>
    <button class="circle-btn btn-out" onclick="pressOut()">OUT</button>
  </div>

  <!-- Surowy Czas IN / OUT -->
  <div style="display: flex; width: 100%; justify-content: space-between; gap: 10px;">
    <div class="time-block" style="flex: 1;">
      <div class="time-label">TIME</div>
      <div class="time-desc" onclick="editTime('rawIn')">
        <span id="txt-raw-in">Kliknij IN, aby zarejestrować czas startu</span>
      </div>
    </div>
    <div class="time-block" style="flex: 1;">
      <div class="time-label">TIME</div>
      <div class="time-desc" onclick="editTime('rawOut')">
        <span id="txt-raw-out">Kliknij OUT, aby zarejestrować koniec</span>
      </div>
    </div>
  </div>

  <!-- Przycisk +15m -->
  <button class="plus-btn" onclick="add15m()">+15m</button>

  <!-- Skorygowany Czas IN / OUT -->
  <div style="display: flex; width: 100%; justify-content: space-between; gap: 10px;">
    <div class="time-block" style="flex: 1;">
      <div class="time-label">TIME</div>
      <div class="time-desc" onclick="editTime('adjIn')">
        <span id="txt-adj-in">Czas IN po korekcie</span>
      </div>
    </div>
    <div class="time-block" style="flex: 1;">
      <div class="time-label">TIME</div>
      <div class="time-desc" onclick="editTime('adjOut')">
        <span id="txt-adj-out">Czas OUT po korekcie</span>
      </div>
    </div>
  </div>

  <!-- Podsumowanie tygodnia -->
  <div class="summary-card">
    <div class="summary-title">TOTAL FOR THE WEEK</div>
    <div class="summary-desc">
      Suma godzin z całego tygodnia (poniedziałek – niedziela), uwzględniając nocki przechodzące przez północ.
    </div>
    <div id="week-total" style="font-size: 1.4rem; font-weight: bold; color: var(--accent-in);">0h 0m</div>
    
    <div class="logs-list" id="logs-container">
      <!-- Tutaj wpadają zapisane dni -->
    </div>

    <button class="export-btn" onclick="exportCSV()">Pobierz raport (CSV / Excel)</button>
  </div>
</div>

<script>
  let data = JSON.parse(localStorage.getItem('punch_data')) || {
    rawIn: null, rawOut: null, adjIn: null, adjOut: null, history: []
  };

  // Zegar na żywo
  setInterval(() => {
    const now = new Date();
    document.getElementById('live-clock').innerText = now.toLocaleTimeString();
    document.getElementById('live-date').innerText = now.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
  }, 1000);

  function updateUI() {
    document.getElementById('txt-raw-in').innerText = data.rawIn ? `Zarejestrowano: ${data.rawIn}` : "Tu wyświetl czas IN. Kliknij, aby zmienić.";
    document.getElementById('txt-raw-out').innerText = data.rawOut ? `Zarejestrowano: ${data.rawOut}` : "Tu wyświetl czas OUT. Kliknij, aby zmienić.";
    document.getElementById('txt-adj-in').innerText = data.adjIn ? `Skorygowany: ${data.adjIn}` : "Po dodaniu 15 min / edycji";
    document.getElementById('txt-adj-out').innerText = data.adjOut ? `Skorygowany: ${data.adjOut}` : "Po dodaniu 15 min / edycji";

    const logsContainer = document.getElementById('logs-container');
    logsContainer.innerHTML = '';
    
    let totalMinutes = 0;

    data.history.forEach((h, idx) => {
      totalMinutes += h.minutes;
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = `<span>${h.date} (${h.in} - ${h.out})</span> <b>${h.duration}</b> <span style="color:#ff6b6b; cursor:pointer;" onclick="delLog(${idx})">✖</span>`;
      logsContainer.appendChild(div);
    });

    const th = Math.floor(totalMinutes / 60);
    const tm = totalMinutes % 60;
    document.getElementById('week-total').innerText = `${th}h ${tm}m`;

    localStorage.setItem('punch_data', JSON.stringify(data));
  }

  function pressIn() {
    const now = new Date();
    data.rawIn = now.toTimeString().slice(0,5);
    data.adjIn = data.rawIn; // domyślnie równy surowemu
    updateUI();
  }

  function pressOut() {
    const now = new Date();
    data.rawOut = now.toTimeString().slice(0,5);
    data.adjOut = data.rawOut;
    updateUI();

    // Jeśli mamy komplet IN i OUT, zapisz automatycznie do historii
    if (data.adjIn && data.adjOut) {
      calculateAndSaveShift();
    }
  }

  function add15m() {
    if (!data.adjOut) {
      alert("Najpierw ustaw czas OUT!");
      return;
    }
    let [h, m] = data.adjOut.split(':').map(Number);
    m += 15;
    if (m >= 60) { h = (h + 1) % 24; m -= 60; }
    data.adjOut = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    updateUI();
    calculateAndSaveShift();
  }

  function editTime(type) {
    let val = prompt("Wpisz nowy czas (format HH:MM):", data[type] || "00:00");
    if (val) {
      data[type] = val;
      updateUI();
      if (data.adjIn && data.adjOut) calculateAndSaveShift();
    }
  }

  function calculateAndSaveShift() {
    let [inH, inM] = data.adjIn.split(':').map(Number);
    let [outH, outM] = data.adjOut.split(':').map(Number);

    let startMins = inH * 60 + inM;
    let endMins = outH * 60 + outM;

    // Obsługa nocki (przejście przez północ)
    if (endMins < startMins) {
      endMins += 24 * 60; 
    }

    let diff = endMins - startMins;
    let hours = Math.floor(diff / 60);
    let mins = diff % 60;

    const todayStr = new Date().toLocaleDateString();
    
    // Sprawdź czy dzisiejszy wpis już istnieje, jak tak to zaktualizuj, jak nie to dodaj
    data.history.push({
      date: todayStr,
      in: data.adjIn,
      out: data.adjOut,
      duration: `${hours}h ${mins}m`,
      minutes: diff
    });

    updateUI();
  }

  function delLog(idx) {
    data.history.splice(idx, 1);
    updateUI();
  }

  function exportCSV() {
    if (data.history.length === 0) {
      alert("Brak danych do eksportu!");
      return;
    }
    let csv = "Data;Start;Koniec;Czas\n";
    data.history.forEach(h => {
      csv += `${h.date};${h.in};${h.out};${h.duration}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "raport_czasu_pracy.csv";
    link.click();
  }

  updateUI();
</script>

</body>
</html>
